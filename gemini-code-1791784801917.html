<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>천안불당중학교 - 시스템 로그인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 transition-all">
    <!-- 헤더 -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-800 p-6 text-center text-white relative">
      <div class="w-16 h-16 mx-auto mb-3 bg-white/10 rounded-full flex items-center justify-center border border-white/20 backdrop-blur">
        <i class="fa-solid fa-graduation-cap text-3xl text-amber-300"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight">천안불당중학교</h1>
      <p class="text-blue-200 text-xs mt-1">학생 상벌점 관리 시스템 (교직원용)</p>
    </div>

    <!-- 본문 영역 -->
    <div class="p-6">
      <!-- 탭 버튼 -->
      <div class="flex border-b border-slate-200 mb-5">
        <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-sm font-bold text-blue-700 border-b-2 border-blue-700 transition">교직원 로그인</button>
        <button id="tabBtnRegister" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition">선생님 회원가입</button>
      </div>

      <!-- 알림 메시지 영역 -->
      <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2"></div>

      <!-- 로그인 폼 -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">아이디</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-regular fa-user text-sm"></i>
            </span>
            <input type="text" id="loginId" required placeholder="아이디를 입력하세요" 
              class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white transition">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </span>
            <input type="password" id="loginPw" required placeholder="비밀번호를 입력하세요" 
              class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white transition">
          </div>
        </div>
        <button type="submit" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> 시스템 접속하기
        </button>
      </form>

      <!-- 회원가입 폼 -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">성명 <span class="text-rose-500">*</span></label>
          <input type="text" id="regName" required placeholder="예: 김선생" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">아이디 <span class="text-rose-500">*</span></label>
            <input type="text" id="regId" required placeholder="아이디" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호 <span class="text-rose-500">*</span></label>
            <input type="password" id="regPw" required placeholder="비밀번호" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">담당 학급 (선택사항)</label>
          <input type="text" id="regHomeroom" placeholder="예: 1학년 2반" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">가입 승인 코드 <span class="text-rose-500">*</span></label>
          <input type="password" id="regCode" required placeholder="교내 배부 가입 코드 (4자리)" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600 focus:bg-white">
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition">
          가입 신청하기
        </button>
      </form>

      <!-- 학생 조회 페이지 이동 버튼 -->
      <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <a href="student.html" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-blue-600 hover:text-blue-800 font-semibold transition">
          <i class="fa-solid fa-user-graduate"></i> 학생 전용 상벌점 조회 사이트 바로가기 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = { TEACHERS: 'BDS_TEACHERS', CURRENT_USER: 'BDS_CURRENT_USER' };
    const SIGNUP_CODE = '0522';

    // 기본 관리자 계정 생성 (최초 실행 시)
    function initializeAdmin() {
      let teachers = JSON.parse(localStorage.getItem(STORAGE_KEYS.TEACHERS) || 'null');
      if (!teachers || teachers.length === 0) {
        teachers = [{
          id: 'dydwls0831', name: '관리자 교사', password: 'points0831!',
          homeroom: '생활지도부', role: 'admin', status: 'approved',
          createdAt: new Date().toISOString()
        }];
        localStorage.setItem(STORAGE_KEYS.TEACHERS, JSON.stringify(teachers));
      }
    }

    // 이미 로그인된 상태인지 확인
    function checkAuthSession() {
      const savedUser = localStorage.getItem(STORAGE_KEYS.CURRENT_USER);
      if (savedUser) {
        try {
          const currentUser = JSON.parse(savedUser);
          const teachers = JSON.parse(localStorage.getItem(STORAGE_KEYS.TEACHERS) || '[]');
          const matched = teachers.find(t => t.id === currentUser.id);
          if (matched && matched.status === 'approved') {
            window.location.href = 'dashboard.html'; // 대시보드로 이동
          }
        } catch (e) {}
      }
    }

    function switchAuthTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('authAlert').classList.add('hidden');
      
      const tabLogin = document.getElementById('tabBtnLogin');
      const tabReg = document.getElementById('tabBtnRegister');
      if (tab === 'login') {
        tabLogin.className = "flex-1 pb-3 text-sm font-bold text-blue-700 border-b-2 border-blue-700 transition";
        tabReg.className = "flex-1 pb-3 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition";
      } else {
        tabReg.className = "flex-1 pb-3 text-sm font-bold text-blue-700 border-b-2 border-blue-700 transition";
        tabLogin.className = "flex-1 pb-3 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition";
      }
    }

    function showAuthAlert(msg, type = 'error') {
      const alert = document.getElementById('authAlert');
      alert.className = `mb-4 p-3 rounded-xl text-xs font-medium flex items-center gap-2 border ${
        type === 'error' ? 'bg-rose-50 text-rose-700 border-rose-200' :
        type === 'success' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
        'bg-amber-50 text-amber-800 border-amber-200'
      }`;
      alert.innerHTML = `<span>${msg}</span>`;
      alert.classList.remove('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPw').value;
      const teachers = JSON.parse(localStorage.getItem(STORAGE_KEYS.TEACHERS) || '[]');
      const teacher = teachers.find(t => t.id === id);

      if (!teacher) return showAuthAlert('등록되지 않은 교사 아이디입니다.', 'error');
      if (teacher.password !== pw) return showAuthAlert('비밀번호가 올바르지 않습니다.', 'error');
      if (teacher.status !== 'approved') return showAuthAlert('관리자 승인 대기 중입니다.', 'warning');

      localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(teacher));
      window.location.href = 'dashboard.html'; // 로그인 성공 시 이동
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const id = document.getElementById('regId').value.trim();
      const pw = document.getElementById('regPw').value;
      const homeroom = document.getElementById('regHomeroom').value.trim();
      const code = document.getElementById('regCode').value.trim();

      if (code !== SIGNUP_CODE) return showAuthAlert('가입 코드가 일치하지 않습니다.', 'error');
      
      const teachers = JSON.parse(localStorage.getItem(STORAGE_KEYS.TEACHERS) || '[]');
      if (teachers.some(t => t.id === id)) return showAuthAlert('이미 존재하는 아이디입니다.', 'error');

      const newTeacher = {
        id, name, password: pw, homeroom: homeroom || '선택안함',
        role: id === 'dydwls0831' ? 'admin' : 'teacher',
        status: id === 'dydwls0831' ? 'approved' : 'pending',
        createdAt: new Date().toISOString()
      };

      teachers.push(newTeacher);
      localStorage.setItem(STORAGE_KEYS.TEACHERS, JSON.stringify(teachers));
      showAuthAlert('가입 신청이 완료되었습니다! 관리자 승인 후 로그인 가능합니다.', 'success');
      
      document.getElementById('registerForm').reset();
      setTimeout(() => { switchAuthTab('login'); document.getElementById('loginId').value = id; }, 1500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initializeAdmin();
      checkAuthSession();
    });
  </script>
</body>
</html>
