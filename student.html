<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>천안불당중학교 - 학생 상벌점 조회</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-between">
  <!-- 상단 헤더 -->
  <header class="w-full bg-white border-b border-slate-200 shadow-xs">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-900 text-amber-300 flex items-center justify-center shadow-md">
          <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-slate-900 text-base sm:text-lg tracking-tight">천안불당중학교</h1>
          <p class="text-[11px] text-blue-600 font-bold">학생 상벌점 실시간 조회 포털</p>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full max-w-2xl px-4 py-8 flex-1 flex flex-col justify-center">
    <!-- 본인 확인 입력 카드 -->
    <div id="authCard" class="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8">
      <div class="text-center mb-6">
        <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">학생 본인 확인</h2>
      </div>

      <div id="alertMsg" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">
        <span id="alertText">일치하는 학생을 찾을 수 없습니다.</span>
      </div>

      <form id="studentAuthForm" onsubmit="handleStudentLookup(event)" class="space-y-4">
        <div class="grid grid-cols-3 gap-2.5">
          <div><label class="block text-xs font-bold text-slate-700 mb-1.5">학년</label><select id="inputGrade" required class="w-full px-3 py-2 text-sm bg-slate-50 border rounded-xl"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></div>
          <div><label class="block text-xs font-bold text-slate-700 mb-1.5">반</label><input type="number" id="inputClass" required min="1" max="25" class="w-full px-3 py-2 text-sm bg-slate-50 border rounded-xl"></div>
          <div><label class="block text-xs font-bold text-slate-700 mb-1.5">번호</label><input type="number" id="inputNumber" required min="1" max="50" class="w-full px-3 py-2 text-sm bg-slate-50 border rounded-xl"></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">학생 성명</label>
          <input type="text" id="inputName" required placeholder="예: 홍길동" class="w-full px-3 py-2.5 text-sm bg-slate-50 border rounded-xl">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">생년월일</label>
          <input type="text" id="inputBirth" required placeholder="예: 2012-03-24 또는 120324" class="w-full px-3 py-2.5 text-sm bg-slate-50 border rounded-xl">
        </div>
        <button type="submit" class="w-full mt-2 py-3.5 bg-blue-700 text-white font-extrabold rounded-2xl text-sm shadow-md transition">상벌점 조회하기</button>
      </form>
    </div>

    <!-- 결과 카드 -->
    <div id="resultCard" class="hidden space-y-5 transition-all">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-6">
        <div class="flex justify-between items-center pb-5 border-b border-slate-100 mb-4">
          <div>
            <h2 class="text-2xl font-black text-slate-900 mt-1 flex items-center gap-2">
              <span id="resStudentName">학생명</span>
              <span class="text-sm text-slate-500" id="resStudentCode"></span>
            </h2>
          </div>
          <button onclick="handleResetLookup()" class="px-3 py-1.5 bg-slate-100 rounded-lg text-xs font-bold">다시 조회</button>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-emerald-50 rounded-xl p-4 text-center">
            <p class="text-xs font-bold text-emerald-700">총 상점</p>
            <h3 class="text-xl font-black text-emerald-800" id="resTotalMerit">+0점</h3>
          </div>
          <div class="bg-rose-50 rounded-xl p-4 text-center">
            <p class="text-xs font-bold text-rose-700">총 벌점</p>
            <h3 class="text-xl font-black text-rose-800" id="resTotalDemerit">-0점</h3>
          </div>
          <div class="bg-blue-50 rounded-xl p-4 text-center">
            <p class="text-xs font-bold text-blue-700">누계 점수</p>
            <h3 class="text-xl font-black text-blue-900" id="resNetScore">0점</h3>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBmN1XZLhsjrlN0XV5hFaMHhmpIulCaxhA",
      authDomain: "buldang-school.firebaseapp.com",
      databaseURL: "https://buldang-school-default-rtdb.firebaseio.com/",
      projectId: "buldang-school",
      storageBucket: "buldang-school.firebasestorage.app",
      messagingSenderId: "59706126981",
      appId: "1:59706126981:web:07061c065c61d69b7a6fec"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const STORAGE_KEYS = { STUDENTS: 'BDS_STUDENTS', RECORDS: 'BDS_RECORDS' };
    let dbCache = { BDS_STUDENTS: [], BDS_RECORDS: [] };

    function initFirebaseAndLoad(callback) {
      db.ref('/').once('value').then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.BDS_STUDENTS) dbCache.BDS_STUDENTS = data.BDS_STUDENTS;
          if (data.BDS_RECORDS) dbCache.BDS_RECORDS = data.BDS_RECORDS;
        }
        callback();
      }).catch((error) => {
        console.error("DB 연동 실패", error);
        callback(); 
      });
    }

    function normalizeBirth(str) { return str ? str.replace(/[^0-9]/g, '') : ''; }
    function isBirthMatch(inputBirth, dbBirth) {
      const b1 = normalizeBirth(inputBirth), b2 = normalizeBirth(dbBirth);
      if (b1 === b2) return true;
      if (b1.length === 8 && b2.length === 6 && b1.substring(2) === b2) return true;
      if (b1.length === 6 && b2.length === 8 && b2.substring(2) === b1) return true;
      return inputBirth.trim() === dbBirth.trim();
    }

    function handleStudentLookup(e) {
      e.preventDefault();
      const grade = parseInt(document.getElementById('inputGrade').value, 10);
      const classNum = parseInt(document.getElementById('inputClass').value, 10);
      const number = parseInt(document.getElementById('inputNumber').value, 10);
      const name = document.getElementById('inputName').value.trim();
      const birth = document.getElementById('inputBirth').value.trim();

      const students = dbCache.BDS_STUDENTS || [];
      const student = students.find(s => s.grade === grade && s.classNum === classNum && s.number === number && s.name.trim() === name && isBirthMatch(birth, s.birth));

      const alertBox = document.getElementById('alertMsg');
      if (!student) {
        alertBox.classList.remove('hidden');
        return;
      }
      alertBox.classList.add('hidden');
      displayStudentResult(student);
    }

    function displayStudentResult(student) {
      const records = (dbCache.BDS_RECORDS || []).filter(r => r.studentId === student.id);
      document.getElementById('resStudentName').textContent = student.name;
      document.getElementById('resStudentCode').textContent = `(${student.grade}학년 ${student.classNum}반 ${student.number}번)`;

      let totalMerit = 0, totalDemerit = 0;
      records.forEach(r => { if (r.score > 0) totalMerit += r.score; else totalDemerit += r.score; });
      const netScore = totalMerit + totalDemerit;

      document.getElementById('resTotalMerit').textContent = `+${totalMerit}점`;
      document.getElementById('resTotalDemerit').textContent = `${totalDemerit}점`;
      document.getElementById('resNetScore').textContent = `${netScore > 0 ? '+' : ''}${netScore}점`;

      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
    }

    function handleResetLookup() {
      document.getElementById('studentAuthForm').reset();
      document.getElementById('resultCard').classList.add('hidden');
      document.getElementById('authCard').classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFirebaseAndLoad(() => { console.log('파이어베이스 로드 완료'); });
    });
  </script>
</body>
</html>
